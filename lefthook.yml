# Local feedback only. CI is the definitive gate for merging.
# Hooks call repository scripts so tool configuration is not duplicated here.
pre-commit:
  parallel: true
  jobs:
    - name: hygiene
      run: scripts/check-public-repo-hygiene.sh
    - name: format
      glob: '*.{js,ts,json,yml,yaml}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: lint
      run: pnpm lint
    - name: secrets
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck:affected
    - name: test
      run: pnpm test:affected
