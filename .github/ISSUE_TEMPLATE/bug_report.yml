name: Bug report
description: Report something that is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include secrets, tokens or personal data. Report security vulnerabilities privately instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser or device, operating system and app version, if relevant.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots or links that help.
