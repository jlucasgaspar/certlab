# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is an advisory, probabilistic review layer. It does not replace the
# deterministic CI checks or the required human approval (see docs/ci.md).

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  # Explicit, justified exclusions only. Application code, migrations, CI
  # workflows, agent instructions and security configuration are never excluded.
  path_filters:
    # Generated by pnpm; review the manifests that change it instead.
    - '!pnpm-lock.yaml'
