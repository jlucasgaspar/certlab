# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is an advisory, probabilistic review layer. It does not replace the
# deterministic CI checks or human review (see docs/ci.md).

language: en-US

reviews:
  # The strictest profile: more feedback, including nitpicks.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Never pause automatic reviews after a number of reviewed commits.
    auto_pause_after_reviewed_commits: 0
    # Dependency update pull requests from Renovate are validated by the required CI checks.
    # Skipping them saves the hourly review allowance for human and agent changes.
    ignore_usernames:
      - 'renovate[bot]'
  # Explicit, justified exclusions only. Application code, migrations, CI
  # workflows, agent instructions and security configuration are never excluded.
  path_filters:
    # Generated by pnpm; review the manifests that change it instead.
    - '!pnpm-lock.yaml'
  path_instructions:
    - path: '**'
      instructions: |
        Follow AGENTS.md. Flag changes that weaken types, lint rules, tests, security checks or CI gates.
        Flag secrets, personal filesystem paths and private integration identifiers.
        Keep the change scoped to its Linear issue and report unrelated modifications.
        Commit messages and pull request titles must follow Conventional Commits.
    - path: 'packages/{contracts,core}/**'
      instructions: |
        These packages must stay platform-agnostic: flag any dependency on React, Hono, the DOM or Node-only APIs.
        Packages must never import from apps.
    - path: 'apps/api/**'
      instructions: |
        The API must stay runtime-agnostic (Lambda and Node server adapters) and keep business code independent of the runtime.
        Answers are validated on the server; the client must never receive correct answers before submitting.
        Errors use the shape { error: { code, message, details? } } and every request carries a request id.
        Do not use index.ts barrel files; import from the file that defines the symbol.
    - path: 'apps/web/**'
      instructions: |
        Flag hard-coded user-facing copy. The interface must use translation keys with English (en) and Brazilian Portuguese (pt-BR) catalogs, English being the fallback.
        Mobile layout is the source of truth; check responsiveness and accessibility.
    - path: '.github/**'
      instructions: |
        Check least-privilege permissions, actions pinned to commit SHAs, stable required-check job names, and that untrusted input is never interpolated into shell commands.
        Flag pull_request_target combined with checking out pull request code.
    - path: 'docs/adr/**'
      instructions: |
        ADRs follow docs/adr/template.md. Accepted decisions must not be silently changed; a new decision needs a new ADR that supersedes the old one.
